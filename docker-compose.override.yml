version: "3.8"

services:
    # JSON Server для API
    json-server:
        ports:
            - "3001:3001"
        volumes:
            - .:/app
            - /app/node_modules
        command: ["npm", "run", "server"]

    # Основное приложение
    app-dev:
        ports:
            - "5173:5173"
        volumes:
            - .:/app
            - /app/node_modules
        depends_on:
            - json-server
        command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]
