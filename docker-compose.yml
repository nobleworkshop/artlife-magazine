version: "3.8"

services:
    # JSON Server для API
    json-server:
        build:
            context: .
            target: development
        ports:
            - "3001:3001"
        volumes:
            - .:/app
            - /app/node_modules
        environment:
            - NODE_ENV=development
        command: ["npm", "run", "server"]
        profiles:
            - dev

    # Разработка
    app-dev:
        build:
            context: .
            target: development
        ports:
            - "5173:5173"
        volumes:
            - .:/app
            - /app/node_modules
        environment:
            - NODE_ENV=development
        depends_on:
            - json-server
        profiles:
            - dev

    # Продакшен
    app-prod:
        build:
            context: .
            target: production
        ports:
            - "8080:80"
        environment:
            - NODE_ENV=production
        profiles:
            - prod

    # Сборка
    app-build:
        build:
            context: .
            target: build
        volumes:
            - ./dist:/app/dist
        profiles:
            - build
